# Runs on every push to main and every pull request (GitHub: jwittTIG/tig-carrier-intelligence, D10).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tci_dev
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tci_test
      ALLOW_REMOTE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database tci_dev"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database tci_test"
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
